services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: aurora-lavalink
    restart: unless-stopped
    depends_on:
      - yt-cipher
    # Kontener dostaje tylko te zmienne, które czyta application.yml – nie cały .env.
    # Działają w nim zewnętrzne pluginy, więc DISCORD_TOKEN, WEB_PANEL_TOKEN itd. nie powinny tam trafiać.
    # Dodajesz nowe ${VAR} do application.yml? Dopisz je też tutaj.
    environment:
      SERVER_PORT: "2333"
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      _JAVA_OPTIONS: -Xms256M -Xmx1G
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-logs:/opt/Lavalink/logs
    ports:
      - "127.0.0.1:2333:2333"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H "Authorization: $${LAVALINK_SERVER_PASSWORD}"
          http://127.0.0.1:2333/version > /dev/null
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher@sha256:4c5ec381ff57336cfc24822d2b526a5ad7cd0171f61065a1bbc87bb736842449
    container_name: aurora-yt-cipher
    restart: unless-stopped
    environment:
      OVERRIDE_PLAYER_VARIANT: IAS

volumes:
  lavalink-logs:
